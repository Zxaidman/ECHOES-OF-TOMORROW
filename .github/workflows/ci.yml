name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "project.godot"
      - "scenes/**"
      - "game/**"
      - "content/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main, develop]
    paths:
      - "project.godot"
      - "scenes/**"
      - "game/**"
      - "content/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Headless validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import and parse project
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Run headless tests
        run: '"$GODOT_BIN" --headless --path . --script res://tests/run_tests.gd'
